server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      routes:
        # =====================================================
        # 兼容路由：前端旧路径 → 微服务新路径（优先匹配）
        # =====================================================

        # 用例 CRUD: /api/cases/** → /api/platform/cases/**
        - id: platform-cases-legacy
          uri: lb://platform-service
          predicates:
            - Path=/api/cases/**
          filters:
            - RewritePath=/api/cases/(?<segment>.*), /api/platform/cases/$\{segment}

        # AI 配置: /api/config → /api/platform/config
        - id: platform-config-legacy
          uri: lb://platform-service
          predicates:
            - Path=/api/config
          filters:
            - RewritePath=/api/config, /api/platform/config

        # 最新报告: /api/reports/latest → /api/platform/reports/latest
        - id: platform-reports-latest-legacy
          uri: lb://platform-service
          predicates:
            - Path=/api/reports/latest
          filters:
            - RewritePath=/api/reports/latest, /api/platform/reports/latest

        # 执行测试（同步）: /api/execute → /api/engine/execute-sync
        - id: engine-execute-sync-legacy
          uri: http://${EXECUTE_HOST:localhost}:${EXECUTE_PORT:3001}
          predicates:
            - Path=/api/execute
          filters:
            - RewritePath=/api/execute, /api/engine/execute-sync

        # 生成脚本: /api/generate-script → /api/engine/generate-script
        - id: engine-generate-script-legacy
          uri: http://${EXECUTE_HOST:localhost}:${EXECUTE_PORT:3001}
          predicates:
            - Path=/api/generate-script
          filters:
            - RewritePath=/api/generate-script, /api/engine/generate-script

        # 更新并执行: /api/update-and-execute → /api/platform/update-and-execute (Platform 编排)
        - id: platform-update-execute
          uri: lb://platform-service
          predicates:
            - Path=/api/update-and-execute
          filters:
            - RewritePath=/api/update-and-execute, /api/platform/update-and-execute

        # 异步执行状态轮询: /api/execute/** → execute-service:3001/execute/**
        - id: execute-async-status
          uri: http://${EXECUTE_HOST:localhost}:${EXECUTE_PORT:3001}
          predicates:
            - Path=/api/execute/**
          filters:
            - RewritePath=/api/execute/(?<segment>.*), /execute/${segment}

        # =====================================================
        # 原生微服务路由
        # =====================================================

        # Platform 业务服务路由
        - id: platform-service
          uri: lb://platform-service
          predicates:
            - Path=/api/platform/**
          filters:
            - StripPrefix=0
          metadata:
            response-timeout: -1

        # Execute Service SSE 路由
        - id: execute-sse
          uri: http://${EXECUTE_HOST:localhost}:${EXECUTE_PORT:3001}
          predicates:
            - Path=/sse/**
          filters:
            - StripPrefix=0

        # =====================================================
        # OpenAPI 文档路由（Knife4j）
        # =====================================================
        - id: platform-api-docs
          uri: lb://platform-service
          predicates:
            - Path=/v3/api-docs,/v3/api-docs/**
          filters:
            - StripPrefix=0

        - id: platform-swagger-ui-html
          uri: lb://platform-service
          predicates:
            - Path=/swagger-ui.html
          filters:
            - StripPrefix=0

        - id: platform-swagger-ui
          uri: lb://platform-service
          predicates:
            - Path=/swagger-ui/**
          filters:
            - StripPrefix=0

        - id: platform-doc-html
          uri: lb://platform-service
          predicates:
            - Path=/doc.html
          filters:
            - StripPrefix=0

        - id: platform-webjars
          uri: lb://platform-service
          predicates:
            - Path=/webjars/**
          filters:
            - StripPrefix=0

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: ${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
            allowedMethods: ${GATEWAY_CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
            allowedHeaders: ${GATEWAY_CORS_ALLOWED_HEADERS:Authorization,Content-Type,X-Requested-With}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
