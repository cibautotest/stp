server:
  port: 8081

spring:
  application:
    name: platform-service
  jackson:
    time-zone: Asia/Shanghai
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: true
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/uitest?useUnicode=true&characterEncoding=utf-8&useSSL=true&serverTimezone=Asia/Shanghai}
    username: ${SPRING_DATASOURCE_USERNAME:uitest}
    password: ${SPRING_DATASOURCE_PASSWORD:cib@1234}
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.smarttesting.platform.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info

# =====================================================
# Knife4j / SpringDoc OpenAPI3 閰嶇疆
# =====================================================
springdoc:
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /v3/api-docs
  group-configs:
    - group: platform
      display-name: 骞冲彴鏈嶅姟 API
      paths-to-match: /api/platform/**
      packages-to-scan: com.smarttesting.platform.controller

knife4j:
  enable: ${KNIFE4J_ENABLED:false}
  setting:
    language: zh_cn
    enable-swagger-models: true
    enable-document-manage: false
    swagger-model-name: Models
    enable-version: true

# =====================================================
# OpenFeign 閰嶇疆锛圗xecute 鎵ц鍙兘鑰楁椂鏁板垎閽燂級
# =====================================================
feign:
  client:
    config:
      execute-client:
        connectTimeout: 10000
        readTimeout: 300000

# =====================================================
# JWT 閰嶇疆
# =====================================================
jwt:
  secret: ${JWT_SECRET}

security:
  cookie-secure: ${SECURITY_COOKIE_SECURE:false}

reports:
  storage-directory: ${REPORT_STORAGE_DIRECTORY:./data/reports}
  upload-token: ${REPORT_UPLOAD_TOKEN}
  max-upload-size: ${REPORT_MAX_UPLOAD_SIZE:52428800}

observability:
  kafka:
    enabled: ${OBSERVABILITY_KAFKA_ENABLED:true}
    topic: ${KAFKA_TOPIC:ui-test-api-exchange.v1}
    group-id: ${KAFKA_GROUP_ID:platform-api-exchange}
    client-id: ${KAFKA_CLIENT_ID:smart-testing-execute}
    username: ${KAFKA_USERNAME:}
    password: ${KAFKA_PASSWORD:}
  skywalking:
    graphql-url: ${SKYWALKING_GRAPHQL_URL:http://localhost:12800/graphql}
